name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > aurelis-release.jks
          ls -la aurelis-release.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # OJO: usamos `gradle`, NO `./gradlew`
      - name: Build Release APK
        env:
          # Firma (leídas por readSigning() en build.gradle.kts)
          STORE_FILE:     "aurelis-release.jks"
          STORE_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}

          # Listen Together (opcional)
          LISTEN_TOGETHER_SERVER: ${{ secrets.LISTEN_TOGETHER_SERVER }}

          # ✅ Last.fm eliminado: no se pasan LASTFM_API_KEY ni LASTFM_SECRET
        run: gradle clean assembleRelease --no-daemon --stacktrace

      - name: Verify APK is signed
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n1)
          echo "APK: $APK"
          $ANDROID_HOME/build-tools/*/apksigner verify --verbose "$APK" || {
            echo "::error::El APK no está firmado correctamente"
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aurelis-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
