name: Build APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK manually
        shell: bash
        run: |
          set -e
          mkdir -p "$ANDROID_HOME"
          cd "$ANDROID_HOME"

          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          rm -f cmdline-tools.zip

          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            :
          fi

          # Estructura esperada: $ANDROID_HOME/cmdline-tools/bin/sdkmanager
          # Si viene en una carpeta "cmdline-tools", la movemos a la estructura típica
          if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            :
          fi

          # Ajuste por la estructura real del zip
          if [ -d "$ANDROID_HOME/cmdline-tools" ] && [ ! -d "$ANDROID_HOME/cmdline-tools/bin" ]; then
            mkdir -p "$ANDROID_HOME/cmdline-tools"
            if [ -d "$ANDROID_HOME/cmdline-tools-*" ]; then
              mv "$ANDROID_HOME"/cmdline-tools-*/* "$ANDROID_HOME/cmdline-tools/" 2>/dev/null || true
            fi
          fi

          if [ ! -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "Using cmdline-tools latest layout"
            else
              echo "sdkmanager not found in expected path"
              find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager 2>/dev/null || true
              exit 1
            fi
          fi

          yes | "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1"

      - name: Decode Keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        shell: bash
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > aura-release.jks

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
